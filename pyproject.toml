[project]
name = "telepathy"
version = "0.1.0.dev0"
description = "Your coding agent's memory, on every machine: choose memory bundles per project, combine them, share them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zine-Elabidine LAABOUDI", email = "zine.elabidine251@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["claude-code", "agents", "memory", "knowledge", "sync"]

[project.scripts]
telepathy = "telepathy:main"
tp = "telepathy:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.13.0"]
build-backend = "uv_build"
